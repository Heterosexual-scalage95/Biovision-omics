[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biovision-omics"
version = "0.1.0"
description = "Reproducible biological imaging and spatial transcriptomics ML project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "requests>=2.32,<3", "tqdm>=4.66,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
